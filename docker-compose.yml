
services:
  ollama:
    image: ollama/ollama:latest
    container_name: gdd-ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  organizer:
    build: .
    image: gmail-daily-digest:3.0.0
    depends_on:
      - ollama
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOME: /data
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://ollama:11434}
    volumes:
      - ./config.json:/app/config.json:ro
      - ${MAIL_CLI_DIR:-${HOME}/.config/mail-cli}/organizer-blocklist.json:/data/.config/mail-cli/organizer-blocklist.json
      - ${DIGEST_DATA_DIR:-${HOME}/.config/gmail-daily-digest}:/data/.config/gmail-daily-digest
      - ${DIGEST_REPORT_DIR:-${HOME}/repos/memories/inbox/gmail-organizer}:/data/repos/memories/inbox/gmail-organizer
    command: ["-config", "/app/config.json"]

volumes:
  ollama-models:
